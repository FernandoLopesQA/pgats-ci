# CI de Nível 01 - Disparo Manual através de clique

# nome da pipeline
name: "Execução Manual"

# gatilho / triggers - regras de disparo
# gatilho manual = workflow_dispatch

on:
  workflow_dispatch:

# tarefas dentro da pipeline = jobs
jobs:
  #nome do job
  e2e-tests:
    # maquina onde o job vai rodar
    runs-on: ubuntu-latest

    # passos do job
    steps:
      # clone do projeto
      - uses: actions/checkout@v4

      # instalação do node
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      # instalação do yarn
      - name: Instalando Yarn
        run: npm install -g yarn

      # instalação da dependências
      - name: Instalando dependências
        run: run yarn

      # Instalação dos Browsers do Playright
      - name: Instalando Browsers do Playright
        run: yarn playright install

      # executar os testes e2e
      - name: Executando os testes e2e
        run: yarn run e2e