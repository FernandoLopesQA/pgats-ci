# CI de Nível 02 - Disparo agendado através de schedule

# nome da pipeline
name: 'N2 - Execução agendada'

# gatilho / triggers - regras de disparo
# gatilho manual = workflow_dispatch
# gatilho agendado = schedule
# gatilho por conclusão de outra pipeline = workflow_run

on:
  schedule:
    # cronograma de execução
    # 1 - minuto, 2 - hora, 3 - dia do mês, 4 - mês, 5 - dia da semana
    - cron: '0 0 * * 5' # -> Runs every friday at midnight

  push:
    branches:
      - master

# Permissões necessárias para a extensão test-reporter gravar e ler o relatório dos testes executados

permissions:
  # Permite a action ler o repositório e publicar checks com o relatório dos testes
  contents: read
  # Permite a action criar, atualizar e publicar o relatório de testes
  checks: write

# tarefas dentro da pipeline = jobs
jobs:
  #nome do job
  e2e-tests:
    # maquina onde o job vai rodar
    runs-on: ubuntu-latest

    # passos do job
    steps:
      # clone do projeto
      - uses: actions/checkout@v5

      # instalação do node
      - uses: actions/setup-node@v5
        with:
          node-version: latest

      # instalação do yarn
      - name: Instalando Yarn
        run: npm install -g yarn

      # instalação da dependências
      - name: Instalando dependências
        run: yarn

      # Instalação dos Browsers do Playright
      - name: Instalando Browsers do Playright
        run: yarn playwright install

      # executar os testes e2e
      - name: Executando os testes e2e
        run: yarn run e2e

      # publicação do relatório dos testes executados no GitHub Actions
      # utilizando o arquivo results.xml gerado pelo Playwright
      - name: Publicando relatório dos testes
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Playwright E2E
          path: results.xml
          reporter: java-junit

      # salvar o relatório HTML gerado pelo Playwright
      # permite baixar o relatório completo depois que a pipeline terminar
      # Define tempo de retenção do relatório
      - name: Salvando o relatório HTML do Playwright
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: Relatório de Testes E2E
          path: playwright-report/
          retention-days: 7
