# CI de Nível 04 - Pipeline integrada ao Build do Código

# nome da pipeline
name: 'N4 - Execução Integrada'

# gatilho / triggers - regras de disparo
# gatilho manual = workflow_dispatch
# gatilho agendado = schedule
# gatilho por conclusão de outra pipeline = workflow_run

on:
  workflow_dispatch:

  push:
    branches:
      - master

# Permissões necessárias para a extensão test-reporter gravar e ler o relatório dos testes executados

permissions:
  # Permite a action ler o repositório e publicar checks com o relatório dos testes
  contents: read
  # Permite a action criar, atualizar e publicar o relatório de testes
  checks: write

# tarefas dentro da pipeline = jobs
jobs:
  #nome do job
  inspecao:
    # maquina onde o job vai rodar
    runs-on: ubuntu-latest

    # passos do job
    steps:
      # clone do projeto
      - uses: actions/checkout@v5

      # instalação do node
      - uses: actions/setup-node@v5
        with:
          node-version: latest

      # instalação do yarn
      - name: Instalando Yarn
        run: npm install -g yarn

      # instalação da dependências
      - name: Instalando dependências
        run: yarn

      - name: Inspeção de Código
        run: yarn lint

  # job unidade
  unidade:
    # maquina onde job vai rodar
    # maquina onde o job vai rodar
    runs-on: ubuntu-latest
    needs: [inspecao]

    # passos do job
    steps:
      # clone do projeto
      - uses: actions/checkout@v5

      # instalação do node
      - uses: actions/setup-node@v5
        with:
          node-version: latest

      # instalação do yarn
      - name: Instalando Yarn
        run: npm install -g yarn

      # instalação da dependências
      - name: Instalando dependências
        run: yarn

      - name: Rodando testes unitários
        run: yarn run test

  mutacao:
    runs-on: ubuntu-latest
    needs: [unidade]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: latest

      - name: Instalando Yarn
        run: npm install -g yarn

      - name: Instalando dependências
        run: yarn

      - name: Rodando testes de mutação
        run: yarn run test:mutation

      - name: Salvando relatório HTML do Stryker
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: Relatório de Testes Mutação
          path: reports/mutation/html/
          retention-days: 7

  #nome do job
  e2e-tests:
    # maquina onde o job vai rodar
    runs-on: ubuntu-latest
    needs: [inspecao]

    # passos do job
    steps:
      # clone do projeto
      - uses: actions/checkout@v5

      # instalação do node
      - uses: actions/setup-node@v5
        with:
          node-version: latest

      # instalação do yarn
      - name: Instalando Yarn
        run: npm install -g yarn

      # instalação da dependências
      - name: Instalando dependências
        run: yarn

      # Instalação dos Browsers do Playright
      - name: Instalando Browsers do Playright
        run: yarn playwright install

      # executar os testes e2e
      - name: Executando os testes e2e
        run: yarn run e2e

      # publicação do relatório dos testes executados no GitHub Actions
      # utilizando o arquivo results.xml gerado pelo Playwright
      - name: Publicando relatório dos testes
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Playwright E2E
          path: results.xml
          reporter: java-junit

      # salvar o relatório HTML gerado pelo Playwright
      # permite baixar o relatório completo depois que a pipeline terminar
      # Define tempo de retenção do relatório
      - name: Salvando o relatório HTML do Playwright
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: Relatório de Testes E2E
          path: playwright-report/
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: [unidade, e2e-tests, mutacao]
    steps:
      - name: Simulando deploy
        run: echo "Deploy executado com sucesso"
